[workspace]
members = ["crates/*"]
default-members = ["crates/adeline"]
resolver = "3"

[workspace.package]
version = "0.4.5"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
adeline_assets = { path = "crates/adeline_assets" }
adeline_core = { path = "crates/adeline_core" }
adeline_docs = { path = "crates/adeline_docs" }
adeline_engine = { path = "crates/adeline_engine" }
adeline_ui = { path = "crates/adeline_ui" }

agent-client-protocol = "=3.3.0"
anyhow = "1"
async-channel = "2"
embed-resource = "3.0"
futures = "0.3"
gethostname = "1.1"
image = { version = "0.25", default-features = false, features = ["png"] }
gpui-kit = "=0.9.1"
ignore = "0.4"
jiff = "0.2"
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
mimalloc = "0.1.52"
notify = "8"
nucleo-matcher = "0.3"
resvg = { version = "0.45.1", default-features = false }
serde = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
tokio = "1.53"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
windows-sys = "0.61"

[profile.dev]
debug = 0

[profile.release]
incremental = true
strip = true

[profile.dist]
inherits = "release"
lto = "thin"
incremental = false

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"

unreadable_literal = "allow"
cast_precision_loss = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
type_complexity = "allow"
wildcard_imports = "allow"
enum_glob_use = "allow"
default_trait_access = "allow"
redundant_closure_for_method_calls = "allow"
unused_self = "allow"

missing_errors_doc = "allow"
missing_panics_doc = "allow"
