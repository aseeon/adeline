[package]
name = "adeline"
version = "0.1.0"
edition = "2024"
description = "A native GPUI desktop workspace"
license = "MIT"

[features]
ui-profiling = []

[dependencies]
gpui = "=0.2.2"
unicode-segmentation = "1.12"
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml_ng = "0.10"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
