[workspace]
members = ["crates/*"]
# A plain `cargo build` builds the app. Tests and clippy pass `--workspace`.
default-members = ["crates/adeline"]
resolver = "3"

[workspace.package]
version = "0.1.16"
edition = "2024"
license = "MIT"

[workspace.dependencies]
adeline_assets = { path = "crates/adeline_assets" }
adeline_core = { path = "crates/adeline_core" }
adeline_engine = { path = "crates/adeline_engine" }
adeline_ui = { path = "crates/adeline_ui" }

agent-client-protocol = "=3.3.0"
anyhow = "1"
async-channel = "2"
chrono = "0.4"
embed-resource = "3.0"
futures = "0.3"
gethostname = "1.1"
gpui-kit = "=0.7.0"
notify = "8"
resvg = { version = "0.45.1", default-features = false }
serde = "1"
serde_json = "1"
serde_yaml_ng = "0.10"
tokio = "1.53"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false }
windows-sys = "0.61"

[profile.dev]
debug = 0

# Local release builds skip LTO and reuse unchanged code between builds:
# a one-line edit rebuilds in ~14s instead of ~78s. Thin LTO alone took ~60s.
[profile.release]
incremental = true
strip = true

# Shipped builds (`scripts/package.ps1`, CI artifacts) keep thin LTO.
[profile.dist]
inherits = "release"
lto = "thin"
incremental = false

# Static analysis — the Rust counterpart of basedpyright's strict mode. `rustc`
# already type-checks; these lints add the checks basedpyright layers on top.
# Warnings are errors in CI (see `.cargo/ci-config.toml` and `scripts/clippy`).
# The explicit denies mirror Zed's `[workspace.lints]`.
[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"
# From the Pragmatic Rust Guidelines (M-STATIC-VERIFICATION).
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
# Default groups (correctness, suspicious, style, complexity, perf) stay on.
pedantic = { level = "warn", priority = -1 }

# Adopted from Zed.
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

# Like basedpyright's `reportUnnecessaryTypeIgnoreComment`: suppressions must
# use `#[expect]`, which fails once the lint no longer fires, and give a reason.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

# Restriction lints from the Pragmatic Rust Guidelines (M-STATIC-VERIFICATION).
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"

# Pedantic lints that don't fit GPUI UI code.
too_many_lines = "allow"         # render functions are long by nature
unreadable_literal = "allow"     # 0xRRGGBB colour literals
cast_precision_loss = "allow"    # usize -> f32 layout math
struct_excessive_bools = "allow" # view state flags
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
too_many_arguments = "allow"     # Zed: splitting args fights the borrow checker
type_complexity = "allow"        # Zed: GPUI callback types are long
wildcard_imports = "allow"       # `use super::*` and GPUI prelude imports
enum_glob_use = "allow"          # `use Action::*` inside large action matches
default_trait_access = "allow"   # `..Default::default()` is the GPUI/Zed idiom
redundant_closure_for_method_calls = "allow" # keep `.when(c, |d| d.pl_6())` builder closures
unused_self = "allow"            # render helpers stay methods on their view

# The crates are internal, not a published API, so their public functions
# skip the `# Errors` and `# Panics` sections a library documents.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
