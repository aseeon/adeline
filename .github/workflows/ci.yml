name: CI

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
  CARGO_INCREMENTAL: '0'

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check_style:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: check-todos
        run: ./scripts/check-todos
      - name: check for typos
        uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461
        with:
          config: ./.config/typos.toml

  clippy:
    needs: check_style
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: setup CI cargo config
        shell: bash
        run: |
          mkdir -p ../.cargo
          cp .cargo/ci-config.toml ../.cargo/config.toml
      - name: install Linux libraries
        if: runner.os == 'Linux'
        run: ./scripts/linux
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: clippy
        shell: bash
        run: ./scripts/clippy

  run_tests:
    needs: check_style
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: setup CI cargo config
        shell: bash
        run: |
          mkdir -p ../.cargo
          cp .cargo/ci-config.toml ../.cargo/config.toml
      - name: install Linux libraries
        if: runner.os == 'Linux'
        run: ./scripts/linux
      - name: install lavapipe
        if: runner.os == 'Linux'
        run: sudo apt-get install -y mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: cargo-nextest
      - name: build headless
        run: cargo build --locked --no-default-features --target-dir target/headless
      - name: cargo nextest
        env:
          ADELINE_HEADLESS_EXE: ${{ github.workspace }}/target/headless/debug/adeline${{ runner.os == 'Windows' && '.exe' || '' }}
        run: cargo nextest run --locked --workspace --all-features --profile ci --no-tests=warn
      - name: upload pixel failures
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pixel-failures-${{ runner.os }}
          path: target/pixel-failures
          if-no-files-found: ignore
      - name: cargo nextest (ignored)
        run: cargo nextest run --locked --workspace --all-features --profile ci --run-ignored only --no-tests=warn
      - name: cargo nextest (headless)
        run: cargo nextest run --locked --workspace --exclude adeline_ui --no-default-features --profile ci --no-tests=warn

  check_dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172
        with:
          tool: cargo-shear,cargo-deny
      - name: unused dependencies
        run: cargo shear --locked --deny-warnings --check-test-targets
      - name: Cargo.lock is up to date
        run: cargo update --locked --workspace
      - name: vulnerable dependencies
        run: cargo deny --config .config/deny.toml check advisories

  build:
    needs: [clippy, run_tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ZIP: adeline-${{ matrix.platform }}.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: install Linux libraries
        if: runner.os == 'Linux'
        run: ./scripts/linux
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: cargo build --profile dist
        run: cargo build --profile dist --locked
      - name: zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/dist/adeline.exe -DestinationPath $env:ZIP
      - name: zip (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/macos-app
          ditto -c -k --keepParent target/dist/Adeline.app "$ZIP"
      - name: zip (Linux)
        if: runner.os == 'Linux'
        run: zip -j "$ZIP" target/dist/adeline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ${{ env.ZIP }}
          archive: false
          if-no-files-found: error

  build_headless:
    needs: [clippy, run_tests]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            platform: linux-aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      ZIP: adeline-headless-${{ matrix.platform }}.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: add the target
        run: rustup target add ${{ matrix.target }}
      - name: install musl-gcc
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}
      - name: cargo build --profile dist --no-default-features
        run: cargo build --profile dist --locked --no-default-features --target ${{ matrix.target }}
      - name: smoke test in Alpine
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/target/${{ matrix.target }}/dist:/w:ro" alpine:3.22 sh -euxc '
            /w/adeline --version | grep -qx "[0-9.]* (headless)"
            status=0; /w/adeline --demo || status=$?; [ "$status" -eq 2 ]
            /w/adeline engine start
            /w/adeline engine status
            /w/adeline engine stop
          '
      - name: zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path target/${{ matrix.target }}/dist/adeline.exe -DestinationPath $env:ZIP
      - name: zip
        if: runner.os != 'Windows'
        run: zip -j "$ZIP" target/${{ matrix.target }}/dist/adeline
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          path: ${{ env.ZIP }}
          archive: false
          if-no-files-found: error

  tests_pass:
    needs: [check_style, clippy, run_tests, check_dependencies, build, build_headless]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: check results
        run: |
          [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "false" ]]
