<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adeline Islands</title>
<style>
:root {
  --ui: "Segoe UI Variable Text", "Segoe UI", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", ui-monospace, Consolas, monospace;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  /* type scale, by role. Steps grow by about 1.08 in UI text and 1.2 in headings */
  --t-micro: 11px;   /* group labels, kbd hints, badges */
  --t-caption: 12px; /* times, counts, meta, tooltips, mono beside 13 text */
  --t-ui: 13px;      /* pickers, menus, tabs, trees, step and plan lists */
  --t-body: 14px;    /* rows, header, island titles, buttons */
  --t-prose: 15px;   /* messages, documents, the composer */
  --t-input: 16px;   /* palette search */
  --t-title: 17px;   /* page and section headings */
  --t-display: 20px; /* empty states, big numbers */
  --t-doc: 24px;     /* document title */
  /* stacking: only these steps */
  --z-float: 4;      /* the composer copy that moves between center and right */
  --z-chrome: 5;     /* window controls */
  --z-scrim: 10;
  --z-palette: 11;
  --z-menu: 20;      /* menus open above everything, the palette included */
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #111;
  color: #eee;
  font: var(--t-body)/1.45 var(--ui);
  -webkit-font-smoothing: antialiased;
  font-synthesis: none;
  overflow: hidden;
}
#stage { position: fixed; inset: 0; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; text-align: left; }
input, textarea { font: inherit; color: inherit; background: none; border: 0; outline: 0; }
ol, ul { list-style: none; }
svg.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.grow { flex: 1; }
.app button, .app kbd, #pop { -webkit-user-select: none; user-select: none; }
kbd { font: var(--t-micro)/1 var(--ui); color: var(--fg3); }

/* ---------- shared app shell ---------- */
.app {
  position: relative;
  height: 100%;
  display: flex;
  color: var(--fg);
  background: var(--bg);
  font-variant-numeric: tabular-nums;
  color-scheme: dark;
}
/* scrollbars: thin and invisible until the pointer is over the area that scrolls */
.app .scroll, .app .side-scroll, .app .activity, .app .pane-b, .app .mrail, .pal-list {
  scrollbar-width: thin;
  scrollbar-color: transparent transparent;
  transition: scrollbar-color 200ms ease-out;
}
@media (hover: hover) {
  .app .scroll:hover, .app .side-scroll:hover, .app .activity:hover, .app .pane-b:hover, .app .mrail:hover, .pal-list:hover { scrollbar-color: var(--scroll, oklch(1 0 0 / 0.14)) transparent; }
}
@media (hover: none) {
  .app .scroll, .app .side-scroll, .app .activity, .app .pane-b, .pal-list { scrollbar-color: var(--scroll, oklch(1 0 0 / 0.14)) transparent; }
}
.app :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
/* text fields show focus on their container (ring-strong) and the caret, not an outline */
.app input:focus-visible, .app textarea:focus-visible { outline: none; }
.tb { height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 10px; flex: none; }
.winctl { position: absolute; top: 0; right: 0; height: 40px; display: flex; z-index: var(--z-chrome); }
.winctl span { width: 46px; display: grid; place-items: center; color: var(--fg3); }
.winctl span:last-child:hover { background: #c42b1c; color: #fff; }
.winctl span:not(:last-child):hover { background: var(--hover); }
.iconbtn {
  width: 30px; height: 30px; display: grid; place-items: center;
  border-radius: 7px; color: var(--fg2); flex: none;
  transition: background-color 150ms ease-out, color 150ms ease-out;
}
.iconbtn[aria-pressed="true"] { color: var(--fg); background: var(--sel); }
@media (hover: hover) { .iconbtn:hover { background: var(--hover); color: var(--fg); } }
.iconbtn:active, .pick:active, .send:active, .opt:active, .qbtn:active { transform: scale(0.96); }

/* agent glyphs */
.ag { width: 16px; height: 16px; display: inline-grid; place-items: center; flex: none; }
.ag svg { width: 100%; height: 100%; }
.ag-claude { color: #d97757; }
.ag-codex { color: oklch(0.8 0.07 250); }
.ag-opencode { color: oklch(0.85 0 0); }
.ag-omp { color: oklch(0.8 0.13 150); }

/* status bits */
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.spin {
  width: 12px; height: 12px; border-radius: 50%; flex: none;
  border: 1.5px solid color-mix(in oklch, var(--fg3) 45%, transparent);
  border-top-color: var(--fg);
  animation: spin 0.9s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.pr { display: inline-flex; align-items: center; gap: 3px; flex: none; }
.pr .ic { width: 13px; height: 13px; }
.pr-ok { color: var(--ok); }
.pr-fail { color: var(--err); }
.pr-run { color: var(--warn); }
.pr-merged { color: var(--fg3); }

/* pickers */
.pick {
  height: 28px; display: inline-flex; align-items: center; gap: 5px;
  padding: 0 6px 0 8px; border-radius: 7px; color: var(--fg2); white-space: nowrap;
  transition: background-color 150ms ease-out, color 150ms ease-out;
}
.pick .ic { width: 14px; height: 14px; }
.pick .chev { width: 12px; height: 12px; opacity: 0.7; }
@media (hover: hover) { .pick:hover { background: var(--hover); color: var(--fg); } }

/* ---------- conversation ---------- */
.col { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 28px; }
.scroll { flex: 1; overflow-y: auto; min-height: 0; }
.convo { display: flex; flex-direction: column; gap: 22px; padding: 28px 0 24px; }
.u { align-self: flex-end; max-width: 78%; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.u-b { background: var(--bubble); padding: 10px 14px; border-radius: 14px; font-size: var(--t-prose); line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap; }
.u-meta { font-size: var(--t-caption); color: var(--fg3); }
.files { display: flex; flex-wrap: wrap; gap: 6px; }
.file {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
  border-radius: 7px; background: var(--chip); font-size: var(--t-ui); color: var(--fg2);
}
.file b { font-weight: 500; color: var(--fg); }
.a { display: flex; flex-direction: column; gap: 8px; }
.a-t { font-size: var(--t-prose); line-height: 1.65; text-wrap: pretty; }
.a-t code, .ask code { font: var(--t-ui)/1 var(--mono); padding: 2px 5px; border-radius: 5px; background: var(--chip); color: var(--code); }
.a-meta { display: flex; align-items: center; gap: 6px; font-size: var(--t-caption); color: var(--fg3); }
.a-meta .ag { width: 13px; height: 13px; }

.work { font-size: var(--t-ui); }
.work-h { display: flex; align-items: center; gap: 8px; color: var(--fg3); padding: 4px 0; border-radius: 6px; transition: color 150ms ease-out; }
.work-h .chev { width: 14px; height: 14px; transition: transform 200ms var(--ease-out); }
.work.open .work-h .chev { transform: rotate(90deg); }
@media (hover: hover) { .work-h:hover { color: var(--fg); } }
.steps { display: flex; flex-direction: column; gap: 2px; margin: 6px 0 0 6px; padding-left: 14px; border-left: 1px solid var(--line); }
.step { display: flex; align-items: center; gap: 8px; height: 28px; color: var(--fg2); min-width: 0; }
.step .ic { width: 14px; height: 14px; color: var(--fg3); }
.step .sk { color: var(--fg2); flex: none; }
.step .sd { font: var(--t-caption) var(--mono); color: var(--fg); min-width: 0; }
.step .sm { margin-left: auto; color: var(--fg3); font-size: var(--t-caption); flex: none; padding-left: 12px; }
.step.s-fail .ic, .step.s-fail .sm { color: var(--err); }
.step.s-run .sm { color: var(--fg2); }
.add { color: var(--ok); }
.del { color: var(--err); }

.thinking { display: flex; align-items: center; gap: 10px; font-size: var(--t-body); color: var(--fg2); }
.shimmer {
  background: linear-gradient(90deg, var(--fg3) 0%, var(--fg3) 40%, var(--fg) 50%, var(--fg3) 60%, var(--fg3) 100%);
  background-size: 300% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: shimmer 2.4s linear infinite;
}
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.since { color: var(--fg3); font-size: var(--t-caption); }

.ask { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--ring); }
.ask p { font-size: var(--t-prose); line-height: 1.65; max-width: 68ch; text-wrap: pretty; }
.ask-l { display: flex; align-items: center; gap: 6px; font-size: var(--t-caption); font-weight: 600; color: var(--accent); }
.ask-opts { display: flex; flex-direction: column; gap: 6px; }
.opt {
  display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 12px;
  border-radius: 8px; background: var(--chip); font-size: var(--t-body);
  transition: background-color 150ms ease-out;
}
.opt kbd { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 5px; box-shadow: 0 0 0 1px var(--ring); }
@media (hover: hover) { .opt:hover { background: var(--sel); } }

.empty { padding: 18vh 0 0; text-align: center; color: var(--fg2); display: flex; flex-direction: column; gap: 6px; align-items: center; }
.empty h2 { font-size: var(--t-display); line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; color: var(--fg); text-wrap: balance; }

/* queue */
.queue { display: flex; flex-direction: column; gap: 0; margin-bottom: 8px; border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--ring); overflow: hidden; }
.q-h { display: flex; align-items: center; gap: 6px; padding: 8px 12px 4px; font-size: var(--t-caption); color: var(--fg3); }
.q-i { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; min-height: 40px; }
.q-i + .q-i { box-shadow: 0 -1px 0 var(--line); }
.q-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.q-txt span:first-child { font-size: var(--t-body); }
.q-f { font-size: var(--t-caption); color: var(--fg3); display: flex; align-items: center; gap: 4px; }
.q-f .ic { width: 12px; height: 12px; }
.q-a { display: flex; gap: 2px; flex: none; }
.qbtn { height: 28px; padding: 0 9px; border-radius: 6px; font-size: var(--t-ui); color: var(--fg2); transition: background-color 150ms ease-out, color 150ms ease-out; }
@media (hover: hover) { .qbtn:hover { background: var(--hover); color: var(--fg); } }
.qbtn.pri { color: var(--fg); }

/* composer */
.dock { flex: none; padding-bottom: 14px; }
.composer { border-radius: 14px; background: var(--raise); box-shadow: 0 0 0 1px var(--ring); padding: 6px; display: flex; flex-direction: column; transition: box-shadow 150ms ease-out; }
.composer:focus-within { box-shadow: 0 0 0 1px var(--ring-strong); }
.composer textarea {
  display: block; width: 100%; resize: none; padding: 8px 10px 4px; font-size: var(--t-prose); line-height: 1.5;
  max-height: 40vh; min-height: 32px; color: var(--fg);
}
.composer textarea::placeholder { color: var(--fg3); }
.c-files { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 6px 2px; }
.c-files .file { padding-right: 4px; }
.c-files .file button { position: relative; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 5px; color: var(--fg3); }
.c-files .file button::before { content: ""; position: absolute; inset: -4px; }
.c-files .file button .ic { width: 12px; height: 12px; }
.c-bar { display: flex; align-items: center; gap: 2px; }
.send {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; flex: none; margin-left: 4px;
  background: var(--fg); color: var(--bg); transition: opacity 150ms ease-out, transform 120ms ease-out;
}
.send:disabled { opacity: 0.25; cursor: default; }
.cring { position: relative; width: 32px; height: 32px; flex: none; display: grid; place-items: center; border-radius: 8px; }
.cring svg { width: 18px; height: 18px; transform: rotate(-90deg); }
.cring circle { fill: none; stroke-width: 2.5; }
.cring .tr { stroke: color-mix(in oklch, var(--fg3) 35%, transparent); }
.cring .fl { stroke: var(--ctx, var(--fg2)); stroke-linecap: round; }
.cring .tip { position: absolute; bottom: calc(100% + 8px); right: 0; white-space: nowrap; padding: 6px 9px; border-radius: 8px; background: var(--pal-bg, oklch(0.25 0 0)); box-shadow: 0 0 0 1px var(--ring, oklch(1 0 0 / 0.1)), 0 8px 20px oklch(0 0 0 / 0.3); font-size: var(--t-caption); color: var(--fg2); font-variant-numeric: tabular-nums; pointer-events: none; opacity: 0; transition: opacity 150ms ease-out; }
.cring .tip b { color: var(--fg); font-weight: 500; }
.cring:hover .tip, .cring:focus-visible .tip { opacity: 1; transition-delay: 200ms; }

/* activity (shared content) */
.act { display: flex; flex-direction: column; gap: 18px; }
.act-h { display: flex; align-items: baseline; justify-content: space-between; font-size: var(--t-caption); color: var(--fg3); }
.act-h b { font-weight: 600; color: var(--fg2); }
.act .steps { margin: 0; padding: 0; border: 0; }
.plan { display: flex; flex-direction: column; gap: 2px; }
.plan li { display: flex; align-items: center; gap: 8px; min-height: 28px; font-size: var(--t-ui); color: var(--fg2); }
.plan li .ic { width: 14px; height: 14px; }
.plan li.done { color: var(--fg3); }
.plan li.done .ic { color: var(--ok); }
.plan li.now { color: var(--fg); }
.plan li .n { width: 14px; text-align: center; font-size: var(--t-micro); color: var(--fg3); flex: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-size: var(--t-prose); font-weight: 600; color: var(--fg); }
.stat span { font-size: var(--t-caption); color: var(--fg3); }
.bar { height: 4px; border-radius: 2px; background: color-mix(in oklch, var(--fg3) 30%, transparent); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--fg2); border-radius: 2px; }
.changes li { display: flex; align-items: center; gap: 8px; min-height: 30px; font-size: var(--t-ui); }
.changes li .ic { width: 14px; height: 14px; color: var(--fg3); }
.changes .p { font-family: var(--mono); font-size: var(--t-caption); }
.changes .n { margin-left: auto; font-size: var(--t-caption); display: flex; gap: 6px; flex: none; }
.term { font: var(--t-caption)/1.6 var(--mono); color: var(--fg2); white-space: pre-wrap; overflow-wrap: anywhere; }
.term .ok { color: var(--ok); }
.term .fail { color: var(--err); }

/* search box */
.sbox { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 8px; background: var(--chip); color: var(--fg3); transition: box-shadow 150ms ease-out; }
.sbox:focus-within { box-shadow: 0 0 0 1px var(--ring-strong); }
.sbox input { flex: 1; min-width: 0; color: var(--fg); font-size: var(--t-body); }
.sbox input::placeholder { color: var(--fg3); }
.noresult { padding: 16px 12px; color: var(--fg3); font-size: var(--t-ui); }

/* modes (shared) */
/* main area of a mode: cards sit on the chat background, so they use --card like ask cards */
.mpane { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 8px 12px 13px; }
.mcard { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; border-radius: 14px; background: var(--card); box-shadow: 0 0 0 1px var(--ring); }
.mbar { height: 44px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 8px; box-shadow: 0 1px 0 var(--line); }
.mbar .note { font-size: var(--t-caption); color: var(--fg3); padding: 0 6px; }

/* file tree (Docs, Terminal) */
.tree { display: flex; flex-direction: column; gap: 1px; }
.tr-row { width: 100%; height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 8px 0 calc(8px + var(--d) * 14px); border-radius: 7px; font-size: var(--t-ui); color: var(--fg2); transition: background-color 150ms ease-out, color 150ms ease-out; }
.tr-row .ic { width: 14px; height: 14px; color: var(--fg3); }
.tr-row .ic.chev { width: 12px; height: 12px; }
.tr-row .sp { width: 12px; flex: none; }
@media (hover: hover) { .tr-row:hover { background: var(--hover); color: var(--fg); } }
.tr-row[aria-current="true"] { background: var(--sel); color: var(--fg); }

/* Docs */
.fmt { min-width: 30px; height: 30px; padding: 0 8px; display: grid; place-items: center; border-radius: 7px; font-size: var(--t-ui); color: var(--fg2); transition: background-color 150ms ease-out, color 150ms ease-out; }
@media (hover: hover) { .fmt:hover { background: var(--hover); color: var(--fg); } }
.fmt .ic { width: 15px; height: 15px; }
.fmt b { font-weight: 600; }
.doc { flex: 1; overflow-y: auto; padding: 28px 32px 48px; font-size: var(--t-prose); line-height: 1.65; color: var(--fg); }
.app .doc:focus-visible { outline: none; }
.doc > * { max-width: 68ch; margin-left: auto; margin-right: auto; }
.doc h1 { font-size: var(--t-doc); line-height: 1.2; font-weight: 600; letter-spacing: -0.012em; margin-bottom: 12px; text-wrap: balance; }
.doc h2 { font-size: var(--t-title); line-height: 1.3; font-weight: 600; margin-top: 24px; margin-bottom: 6px; text-wrap: balance; }
.doc p, .doc ul, .doc ol { margin-bottom: 10px; color: var(--fg); }
.doc ul { list-style: disc; padding-left: 22px; }
.doc ol { list-style: decimal; padding-left: 22px; }
.doc li + li { margin-top: 4px; }
.doc code { font: var(--t-ui)/1 var(--mono); padding: 2px 5px; border-radius: 5px; background: var(--chip); color: var(--code); }

/* Terminal */
.term-h { height: 36px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-size: var(--t-caption); color: var(--fg3); box-shadow: 0 1px 0 var(--line); }
.term-h b { font-weight: 500; color: var(--fg2); }
.term-b { flex: 1; overflow-y: auto; padding: 12px 14px 16px; font: var(--t-ui)/1.6 var(--mono); color: var(--fg2); cursor: text; }
.term-b > div { white-space: pre-wrap; overflow-wrap: anywhere; }
.t-cmd { color: var(--fg); }
.t-ok { color: var(--ok); }
.t-err { color: var(--err); }
.t-dim { color: var(--fg3); }
.t-hi { color: var(--code); }
.t-pp { color: var(--ok); }
.t-in { display: flex; gap: 8px; }
.t-in input { flex: 1; min-width: 0; font: inherit; color: var(--fg); caret-color: var(--fg); }

/* Board */
.bfil { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.bfil .gap { width: 8px; }
.fchip { height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; border-radius: 14px; font-size: var(--t-ui); color: var(--fg2); box-shadow: 0 0 0 1px var(--ring); transition: background-color 150ms ease-out, color 150ms ease-out; }
.fchip .ag { width: 13px; height: 13px; }
@media (hover: hover) { .fchip:hover { background: var(--hover); color: var(--fg); } }
.fchip[aria-pressed="true"] { background: var(--sel); color: var(--fg); }
.bcols { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.bcol { min-height: 0; display: flex; flex-direction: column; }
.bcol-h { height: 30px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 4px; font-size: var(--t-caption); font-weight: 600; color: var(--fg2); }
.bcol-h .cnt { font-weight: 400; color: var(--fg3); }
.bcol-l { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 1px 1px 8px; }
.tk { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px; border-radius: 10px; background: var(--card); box-shadow: 0 0 0 1px var(--ring); }
.tk-top { display: flex; align-items: center; gap: 6px; font-size: var(--t-caption); color: var(--fg3); }
.tk-top .ag { margin-left: auto; width: 14px; height: 14px; }
.tk-t { font-size: var(--t-body); line-height: 1.4; }
.bcol.done .tk-t { color: var(--fg2); }
.tk-b { display: flex; align-items: center; gap: 8px; font-size: var(--t-caption); color: var(--fg3); }
.lbl { padding: 1px 7px; border-radius: 5px; background: var(--chip); color: var(--fg2); }
.tk-need { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); white-space: nowrap; }

/* Browser: the page itself is someone else's site, so it keeps its own colors in every theme */
.burl { flex: 1; min-width: 0; height: 30px; display: flex; align-items: center; gap: 8px; margin: 0 4px; padding: 0 12px; border-radius: 8px; background: var(--chip); font-size: var(--t-ui); color: var(--fg3); }
.burl b { font-weight: 400; color: var(--fg); }
.bview { flex: 1; min-height: 0; overflow-y: auto; background: oklch(0.99 0 0); }
.site { color: oklch(0.22 0 0); font: 14px/1.55 var(--ui); }
.site nav { height: 52px; display: flex; align-items: center; gap: 18px; padding: 0 24px; box-shadow: 0 1px 0 oklch(0 0 0 / 0.08); font-size: 13px; color: oklch(0.45 0 0); }
.site nav b { font-size: 15px; color: oklch(0.2 0 0); margin-right: auto; display: flex; align-items: center; gap: 8px; }
.site nav b i { width: 18px; height: 18px; border-radius: 5px; background: oklch(0.6 0.13 var(--sh)); }
.site .hero { padding: 48px 24px 36px; max-width: 640px; }
.site h1 { font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 12px; text-wrap: balance; }
.site .hero p { font-size: 16px; color: oklch(0.42 0 0); margin-bottom: 20px; max-width: 52ch; }
.site .btns { display: flex; gap: 8px; }
.site .btn { height: 36px; padding: 0 16px; display: inline-flex; align-items: center; border-radius: 8px; font-weight: 600; font-size: 13px; background: oklch(0.2 0 0); color: oklch(0.99 0 0); }
.site .btn.ghost { background: none; color: oklch(0.2 0 0); box-shadow: inset 0 0 0 1px oklch(0 0 0 / 0.15); }
.site .feats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; padding: 0 24px 40px; }
.site .feat { padding: 16px; border-radius: 10px; background: oklch(0.96 0.01 var(--sh)); }
.site .feat b { display: block; margin-bottom: 4px; }
.site .feat span { font-size: 13px; color: oklch(0.45 0 0); }
.site article { padding: 32px 24px 48px; max-width: 680px; }
.site article h1 { font-size: 26px; }
.site article p { margin-bottom: 12px; color: oklch(0.35 0 0); }
.site article pre { font: 12.5px/1.6 var(--mono); padding: 12px 14px; border-radius: 8px; background: oklch(0.95 0 0); margin-bottom: 12px; white-space: pre-wrap; }
.oth-row.cur { background: var(--sel); }
.oth-row.cur .oth { color: var(--fg); }

/* Usage */
.mhead { flex: none; display: flex; align-items: center; gap: 8px; }
.mhead h2 { font-size: var(--t-title); line-height: 1.3; font-weight: 600; }
.v3 .mhead .seg { margin: 0 0 0 auto; width: 180px; }
.uscroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 1px; }
.uscroll { container-type: inline-size; }
.ustats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@container (min-width: 520px) { .ustats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.ustat, .ucard { border-radius: 12px; background: var(--card); box-shadow: 0 0 0 1px var(--ring); }
.ustat { padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.ustat b { font-size: var(--t-display); line-height: 1.25; font-weight: 600; letter-spacing: -0.01em; }
.ustat span { font-size: var(--t-caption); color: var(--fg3); }
.ucard { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.ucard h3 { display: flex; align-items: center; gap: 12px; font-size: var(--t-caption); font-weight: 600; color: var(--fg2); }
.ucard h3 .leg { margin-left: auto; display: flex; flex-wrap: wrap; gap: 10px; font-size: var(--t-caption); font-weight: 400; color: var(--fg3); }
.leg span { display: inline-flex; align-items: center; gap: 5px; }
.leg i { width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.leg i + * { color: var(--fg3); }
.uchart { height: 150px; display: flex; align-items: flex-end; gap: 3px; }
.ubar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
.ustack { display: flex; flex-direction: column-reverse; gap: 1px; border-radius: 3px 3px 1px 1px; overflow: hidden; }
.ustack i { display: block; background: currentColor; }
.uaxis { display: flex; gap: 3px; margin-top: -6px; }
.uaxis span { flex: 1; text-align: center; font-size: var(--t-micro); color: var(--fg3); white-space: nowrap; }
.hrows { display: flex; flex-direction: column; gap: 10px; }
.hrow { display: grid; grid-template-columns: minmax(0, 150px) 1fr 52px; align-items: center; gap: 10px; font-size: var(--t-ui); color: var(--fg2); }
.hrow > span:first-child { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hrow .mono { width: 16px; height: 16px; border-radius: 4px; }
.hrow b { font-weight: 400; text-align: right; color: var(--fg3); font-size: var(--t-caption); }
.htrack { height: 6px; border-radius: 3px; background: color-mix(in oklch, var(--fg3) 25%, transparent); overflow: hidden; }
.htrack i { display: block; height: 100%; border-radius: 3px; background: currentColor; }
.ufoot { font-size: var(--t-caption); color: var(--fg3); }
.mbtn { position: relative; }
.mrail { width: 56px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 14px 0; background: var(--rail); box-shadow: 1px 0 0 var(--rail-line, transparent); }
.mrail button { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--fg3); transition: background-color 150ms ease-out, color 150ms ease-out; }
.mrail button .ic { width: 18px; height: 18px; }
/* the active highlight is a ::before so it can slide between buttons without moving the icon */
.mrail button { isolation: isolate; }
.mrail button[aria-pressed="true"]::before { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; background: oklch(var(--ink) / 0.11); }
.mrail button[aria-pressed="true"] { position: relative; color: var(--fg); }
@media (hover: hover) { .mrail button:hover { color: var(--fg); background: var(--hover); } }
.mrail button:active { transform: scale(0.96); }
.mrail .mdot { top: 6px; right: 6px; box-shadow: none; }
.mtitle { padding-left: 8px; font-size: var(--t-body); font-weight: 600; }
.mono { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; flex: none; /* initials are glyphs, not text: 9 in boxes up to 22, --t-micro in bigger ones */ font: 600 9px/1 var(--ui); letter-spacing: 0.02em; color: oklch(0.99 0 0); background: oklch(0.56 0.11 var(--h)); }
.pbadge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: inline-grid; place-items: center; flex: none; background: var(--accent); color: oklch(0.22 0.04 50); font-size: var(--t-micro); font-weight: 600; }
.pproc { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--ok); box-shadow: 0 0 0 2px color-mix(in oklch, var(--ok) 30%, transparent); }
#pop .mono { width: 22px; height: 22px; }
#pop .ph-sec { padding-top: 10px; }
.mdot { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--mdot-ring, var(--bg)); }

/* popover menu (shared) */
#pop {
  position: fixed; z-index: var(--z-menu); min-width: 220px; max-width: 320px; padding: 4px;
  border-radius: 10px; background: oklch(0.24 0 0); color: oklch(0.94 0 0);
  box-shadow: 0 0 0 1px oklch(1 0 0 / 0.09), 0 12px 32px oklch(0 0 0 / 0.45);
  font: var(--t-ui)/1.4 var(--ui); display: none;
  transform-origin: var(--o, top left);
}
#pop.open { display: block; animation: pop-in 150ms var(--ease-out); }
@keyframes pop-in { from { opacity: 0; transform: scale(0.97); } }
#pop .ph { padding: 6px 10px 4px; font-size: var(--t-caption); color: oklch(0.6 0 0); }
#pop button { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 32px; padding: 5px 10px; border-radius: 6px; }
#pop button:focus-visible, #pop button:focus { outline: none; background: oklch(1 0 0 / 0.08); }
@media (hover: hover) { #pop button:hover { background: oklch(1 0 0 / 0.08); } }
#pop .mi { display: flex; flex-direction: column; flex: 1; min-width: 0; }
#pop .mh { font-size: var(--t-caption); color: oklch(0.62 0 0); }
#pop .tick { width: 14px; height: 14px; color: oklch(0.8 0.1 250); margin-left: auto; }
#pop .plan { padding: 2px 8px 6px; --fg: oklch(0.94 0 0); --fg2: oklch(0.8 0 0); --fg3: oklch(0.58 0 0); --ok: oklch(0.75 0.14 150); }

/* =========================================================
   SURFACE TOKENS  (Islands builds on the .v3 tokens)
   ========================================================= */
.v3wrap { position: absolute; inset: 0; overflow: hidden; background: var(--wall-base); }
.wall { position: absolute; inset: 0; pointer-events: none; }
.wall i { position: absolute; border-radius: 50%; }
.v3 {
  --H: 265;
  position: absolute; inset: 14px; height: auto; border-radius: 12px; overflow: hidden;
  --fg: oklch(0.97 0.01 var(--H)); --fg2: oklch(0.84 0.03 var(--H)); --fg3: oklch(0.7 0.04 var(--H));
  --ink: 1 0 0; /* overlay color: white in dark, black in light */
  --line: oklch(var(--ink) / 0.09); --hover: oklch(var(--ink) / 0.07); --sel: oklch(var(--ink) / 0.12);
  --chip: oklch(var(--ink) / 0.08); --ring: oklch(var(--ink) / 0.1); --ring-strong: oklch(var(--ink) / 0.22);
  --code: oklch(0.9 0.06 var(--H)); --accent: oklch(0.78 0.15 55); --ctx: var(--sendbg);
  --ok: oklch(0.82 0.14 150); --err: oklch(0.75 0.15 20); --warn: oklch(0.85 0.12 85); --focus: oklch(var(--ink) / 0.6);
  --sendbg: oklch(0.8 0.1 var(--H)); --sendfg: oklch(0.2 0.05 var(--H)); --scroll: oklch(var(--ink) / 0.2);
  box-shadow: 0 0 0 1px oklch(var(--ink) / 0.14), 0 24px 60px oklch(0.1 0.05 var(--H) / 0.45);
}
.v3[data-surface="tinted"] {
  --bg: oklch(0.4 0.085 var(--H)); --side: oklch(0.35 0.08 var(--H)); --pane: oklch(0.43 0.085 var(--H));
  --bubble: oklch(0.49 0.09 var(--H)); --card: oklch(0.46 0.085 var(--H)); --raise: oklch(0.46 0.085 var(--H));
}
.v3[data-surface="glass"] {
  --bg: oklch(0.3 0.07 var(--H) / 0.5); --side: oklch(0.18 0.05 var(--H) / 0.32); --pane: oklch(1 0 0 / 0.06);
  --bubble: oklch(1 0 0 / 0.13); --card: oklch(1 0 0 / 0.08); --raise: oklch(1 0 0 / 0.09);
  -webkit-backdrop-filter: blur(36px) saturate(1.6); backdrop-filter: blur(36px) saturate(1.6);
}
.v3[data-surface="tinted"] { --rail: oklch(0.3 0.075 var(--H)); }
/* Dark grey follows Quiet's neutral steps */
.v3[data-tint="grey"] {
  --fg: oklch(0.94 0 0); --fg2: oklch(0.74 0 0); --fg3: oklch(0.56 0 0); --code: oklch(0.85 0.09 70);
  --sendbg: oklch(0.9 0 0); --sendfg: oklch(0.2 0 0); --ctx: oklch(0.72 0.13 250);
}
.v3[data-tint="grey"][data-surface="tinted"] {
  --rail: oklch(0.17 0 0); --side: oklch(0.195 0 0); --bg: oklch(0.215 0 0); --pane: oklch(0.24 0 0);
  --bubble: oklch(0.28 0 0); --card: oklch(0.24 0 0); --raise: oklch(0.25 0 0); --pal-bg: oklch(0.25 0 0); --isl-l: oklch(0.185 0 0);
}
.v3[data-tint="grey"][data-surface="glass"] {
  --rail: oklch(0.08 0 0 / 0.4); --side: oklch(0.12 0 0 / 0.32); --bg: oklch(0.2 0 0 / 0.5);
  --pal-bg: oklch(0.22 0 0 / 0.78); --isl-l: oklch(0.1 0 0 / 0.38);
}
.v3wrap[data-tint="grey"] { --wall-base: linear-gradient(160deg, oklch(0.42 0 0), oklch(0.2 0 0)) !important; }
.v3wrap[data-tint="grey"] .wall { filter: grayscale(1) brightness(0.55); }
.v3[data-surface="glass"] { --rail: oklch(0.12 0.04 var(--H) / 0.4); }
.v3 .side { width: 286px; flex: none; background: var(--side); display: flex; flex-direction: column; }
.v3 .seg { display: flex; gap: 2px; margin: 4px 12px 10px; padding: 3px; border-radius: 10px; background: oklch(0 0 0 / 0.16); }
.v3 .seg button { flex: 1; height: 30px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 7px; font-size: var(--t-ui); color: var(--fg2); transition: background-color 150ms ease-out, color 150ms ease-out; }
.v3 .seg button .ic { width: 14px; height: 14px; }
.v3 .seg button[aria-pressed="true"] { background: oklch(1 0 0 / 0.12); color: var(--fg); box-shadow: 0 1px 2px oklch(0 0 0 / 0.15); }
.v3 .seg button span.c { color: var(--fg3); font-size: var(--t-caption); }
.v3 .side > .tb { height: 40px; }
.v3 .side-scroll { flex: 1; overflow-y: auto; padding: 0 8px 12px; }
.v3 .grp-h { display: flex; align-items: center; gap: 6px; width: 100%; height: 30px; padding: 10px 10px 0; font-size: var(--t-micro); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg3); }
.v3 .grp-h .chev { display: none; }
.v3 .grp-h .cnt { margin-left: auto; letter-spacing: 0; font-weight: 400; }
.v3 .grp-needs .grp-h { color: var(--accent); }
.v3 .row { width: 100%; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 10px; border-radius: 8px; transition: background-color 150ms ease-out; }
.v3 .row .t { flex: 1; font-size: var(--t-body); color: var(--fg2); }
.v3 .row.is-unread .t { color: var(--fg); font-weight: 500; }
.v3 .row .when { font-size: var(--t-caption); color: var(--fg3); flex: none; display: flex; align-items: center; }
@media (hover: hover) { .v3 .row:hover { background: var(--hover); } }
.v3 .row[aria-current="true"] { background: var(--sel); }
.v3 .row[aria-current="true"] .t { color: var(--fg); }
.sets { width: min(440px, 100% - 48px); margin: 24px auto; display: flex; flex-direction: column; gap: 4px; }
.sets h2 { font-size: var(--t-title); line-height: 1.3; font-weight: 600; margin-bottom: 8px; }
.surf { min-height: 48px; display: flex; align-items: center; gap: 12px; font-size: var(--t-body); color: var(--fg2); box-shadow: 0 1px 0 var(--line); }
.v3 .surf .seg { margin: 0 0 0 auto; width: 200px; }
.hues { display: flex; gap: 6px; }
.hue { width: 18px; height: 18px; border-radius: 50%; box-shadow: 0 0 0 1px oklch(var(--ink) / 0.25) inset; transition: transform 150ms ease-out; }
.hue[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg); }
.v3 .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.v3 .crumb { display: flex; align-items: center; gap: 8px; font-size: var(--t-body); color: var(--fg2); min-width: 0; }
.v3 .crumb b { font-weight: 500; color: var(--fg); }
.v3 .crumb .sl { color: var(--fg3); }
.v3 .send { background: var(--sendbg); color: var(--sendfg); border-radius: 9px; }
.v3 .pane-b { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }

/* =========================================================
   3 · ISLANDS  (Tinted, split into floating islands)
   brightness: both islands < chat (window background) < composer
   ========================================================= */
.isl { padding: 8px; gap: 8px; }
.isl[data-surface="tinted"] { --isl-l: oklch(0.335 0.08 var(--H)); --pane: oklch(0.435 0.085 var(--H)); }
.isl[data-surface="glass"] { --isl-l: oklch(0.14 0.05 var(--H) / 0.38); --pane: oklch(1 0 0 / 0.09); }
.isl[data-tint="grey"][data-surface="tinted"] { --isl-l: oklch(0.185 0 0); }
.isl[data-tint="grey"][data-surface="glass"] { --isl-l: oklch(0.1 0 0 / 0.38); }
.isl .isl-l, .isl .isl-r { border-radius: 14px; box-shadow: 0 0 0 1px var(--ring), 0 10px 30px oklch(0.08 0.04 var(--H) / 0.3); }
.isl .isl-l { flex: none; margin: 34px 0 13px; display: flex; overflow: hidden; background: var(--isl-l); }
.isl .isl-l .mrail { background: transparent; box-shadow: 1px 0 0 var(--line); }
.isl .isl-l .side { background: transparent; }
/* island content keeps its width while the island opens or closes, so it slides under the rail instead of rewrapping */
.isl .isl-l .side, .isl .isl-rp { overflow: hidden; }
.isl .isl-l .side { align-items: flex-end; }
.isl .isl-l .side > * { width: 286px; }
.isl .isl-rp > * { width: 330px; }
/* chat pane (Docs): conversation and composer inside the right island */
.isl .isl-rp.chatp { width: 440px; }
.isl .isl-rp.chatp > * { width: 440px; }
.isl .chatp .ih { gap: 8px; }
.isl .chatp .col { padding: 0 14px; }
.isl .chatp .convo { padding: 8px 0 20px; }
.isl .chatp .dock { padding-bottom: 12px; }
/* bottom gap is 8px padding + 13px = 21px, half the 42px top gap; the composer matches the islands */
.isl .dock { padding-bottom: 13px; }
/* 8px window padding + 26px puts the title midway down the 42px gap above the islands */
.isl .main .tb { height: 26px; display: flex; justify-content: center; }
.isl .isl-r { flex: none; margin: 34px 0 13px; display: flex; overflow: hidden; background: var(--isl-l); }
.isl .isl-rp { width: 330px; min-width: 0; display: flex; flex-direction: column; }
.isl .isl-r .mrail { background: transparent; }
.isl .isl-rp + .mrail { box-shadow: -1px 0 0 var(--line); }
.isl .isl-r .ih { height: 46px; flex: none; display: flex; align-items: center; padding: 0 16px; font-size: var(--t-body); font-weight: 600; }

/* project switcher + palette (shared) */
.psw { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 10px; margin: 12px 0 8px; border-radius: 10px; background: var(--chip); box-shadow: 0 0 0 1px var(--ring); transition: background-color 150ms ease-out; }
.others { display: flex; flex-direction: column; gap: 1px; margin-bottom: 10px; }
.oth-row { display: flex; align-items: center; border-radius: 8px; transition: background-color 150ms ease-out; }
.oth { flex: 1; min-width: 0; height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border-radius: 8px; font-size: var(--t-ui); color: var(--fg2); }
.oth .mono { width: 18px; height: 18px; border-radius: 5px; }
.oth .c { margin-left: auto; display: flex; align-items: center; }
.oth-x { width: 24px; height: 24px; margin-right: 4px; display: grid; place-items: center; flex: none; border-radius: 6px; color: var(--fg3); opacity: 0; transition: opacity 150ms ease-out, background-color 150ms ease-out, color 150ms ease-out; }
.oth-x .ic { width: 12px; height: 12px; }
.oth-row:focus-within .oth-x { opacity: 1; }
@media (hover: hover) { .oth-row:hover { background: var(--hover); } .oth-row:hover .oth { color: var(--fg); } .oth-row:hover .oth-x { opacity: 1; } .oth-x:hover { background: var(--hover); color: var(--fg); } }
.v3[data-surface="tinted"] { --pal-bg: oklch(0.42 0.085 var(--H)); }
.v3[data-surface="glass"] { --pal-bg: oklch(0.27 0.06 var(--H) / 0.78); }
.v3[data-tint="grey"][data-surface="tinted"] { --pal-bg: oklch(0.25 0 0); }
.v3[data-tint="grey"][data-surface="glass"] { --pal-bg: oklch(0.22 0 0 / 0.78); }
.v3[data-surface="glass"] .pal { -webkit-backdrop-filter: blur(30px) saturate(1.5); backdrop-filter: blur(30px) saturate(1.5); }
.v3 .pal-scrim { background: oklch(0.12 0.04 var(--H) / 0.45); }
.pswitch { padding: 0 10px; flex: none; }
.pswitch .others { margin-bottom: 4px; }
.psw .mono { width: 30px; height: 30px; border-radius: 8px; font-size: var(--t-micro); }
.psw .t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.psw .t b { font-size: var(--t-body); font-weight: 600; }
.psw .t span { font-size: var(--t-caption); color: var(--fg3); }
.psw kbd { flex: none; }
@media (hover: hover) { .psw:hover { background: var(--sel); } }
.pal-scrim { position: absolute; inset: 0; z-index: var(--z-scrim); background: oklch(0.1 0.02 262 / 0.55); animation: fade-in 150ms ease-out; }
.pal { position: absolute; left: 50%; top: 88px; z-index: var(--z-palette); width: min(580px, calc(100% - 32px)); transform: translateX(-50%); border-radius: 14px; overflow: hidden; background: var(--pal-bg); box-shadow: 0 0 0 1px var(--ring), 0 24px 60px oklch(0 0 0 / 0.5); animation: pal-in 180ms var(--ease-out); }
@keyframes pal-in { from { opacity: 0; transform: translateX(-50%) scale(0.97); } }
@keyframes fade-in { from { opacity: 0; } }
.pal-in { display: flex; align-items: center; gap: 10px; height: 54px; padding: 0 16px; color: var(--fg3); box-shadow: 0 1px 0 var(--line); }
.pal-in input { flex: 1; min-width: 0; font-size: var(--t-input); color: var(--fg); }
.pal-in input::placeholder { color: var(--fg3); }
.pal-list { max-height: min(440px, 60vh); overflow-y: auto; padding: 6px; }
.pal-h { padding: 10px 10px 4px; font-size: var(--t-caption); color: var(--fg3); }
.pal-i { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 10px; border-radius: 9px; }
.pal-i[aria-selected="true"] { background: var(--sel); }
@media (hover: hover) { .pal-i:hover { background: var(--hover); } .pal-i[aria-selected="true"]:hover { background: var(--sel); } }
.pal-i .mono { width: 28px; height: 28px; border-radius: 8px; font-size: var(--t-micro); }
.pal-i .t { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.pal-i .t b { font-size: var(--t-body); font-weight: 500; }
.pal-i .t span { font-size: var(--t-caption); color: var(--fg3); }
.pal-i .cur { font-size: var(--t-caption); color: var(--fg3); }

/* =========================================================
   LIGHT THEME
   Same tokens, swapped values. Overlays flip to black through --ink.

/* ---------------- Usage ---------------- */
// ponytail: seeded fake numbers per scope, enough to show the charts
const hash = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 2147483647, 7) || 1;
const rnd = (seed) => () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
// calendar days, so daylight saving changes don't repeat or skip a day
const daysAgo = (k) => { const d = new Date(); d.setDate(d.getDate() - k); return d; };
const MIX = { claude: 0.56, codex: 0.21, opencode: 0.15, omp: 0.08 };
const MODELS = [['Opus 5.5', 0.38], ['Sonnet 5.5', 0.22], ['GPT-5.5 Codex', 0.21], ['Kimi K2', 0.15], ['Fable 5.1', 0.04]];
const scopeName = () => (S.uscope === 'all-machines' ? 'All machines' : S.uscope === 'all-projects' ? 'All projects' : S.uscope);
const scopeProjects = () => (S.uscope === 'all-machines' ? PROJECTS : S.uscope === 'all-projects' ? PROJECTS.filter((p) => p.machine === 'Nexus') : PROJECTS.filter((p) => p.id === S.uscope));
function usageDays(id, n) {
  const r = rnd(hash(id) + n), scale = 0.25 + r() * 0.9;
  return Array.from({ length: n }, (_, i) => {
    const d = daysAgo(n - 1 - i), wk = d.getDay() % 6 === 0 ? 0.3 : 1;
    const base = (0.6 + r() * 1.1) * 1e6 * scale * wk;
    return Object.fromEntries(Object.entries(MIX).map(([k, m]) => [k, base * m * (0.5 + r())]));
  });
}
function usageAll() {
  const per = scopeProjects().map((p) => [p, usageDays(p.id, S.urange)]);
  const days = per[0][1].map((_, i) => Object.fromEntries(Object.keys(MIX).map((k) => [k, per.reduce((s, [, d]) => s + d[i][k], 0)])));
  return { per, days };
}
const fmtT = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : `${Math.round(n / 1e3)}k`);
const sum = (o) => Object.values(o).reduce((a, b) => a + b, 0);
function usageSide() {
  const row = (id, ic, title, sub) => `<button class="row" data-act="uscope" data-arg="${id}" ${S.uscope === id ? 'aria-current="true"' : ''}>${I[ic]}<span class="t trunc">${title}</span><span class="when">${sub}</span></button>`;
  return `<div class="tree">${row('all-machines', 'machine', 'All machines', `${PROJECTS.length} projects`)}${row('all-projects', 'folder', 'All projects', 'Nexus')}</div>
    ${MACHINES.map(([m, note]) => `<div class="grp-h">${m} · ${note}</div><div class="tree">${PROJECTS.filter((p) => p.machine === m).map((p) => `<button class="row" data-act="uscope" data-arg="${p.id}" ${S.uscope === p.id ? 'aria-current="true"' : ''}>${mono(p.id)}<span class="t trunc">${p.id}</span></button>`).join('')}</div>`).join('')}`;
}
function usageMain() {
  const { per, days } = usageAll();
  const totals = days.map(sum), all = sum(totals), max = Math.max(...totals);
  const byAgent = Object.keys(MIX).map((k) => [k, days.reduce((s, d) => s + d[k], 0)]);
  const dayName = (i) => daysAgo(days.length - 1 - i).toLocaleDateString('en', S.urange === 7 ? { weekday: 'short' } : { day: 'numeric' });
  const bars = days.map((d, i) => `<div class="ubar" title="${dayName(i)} · ${fmtT(totals[i])} tokens"><div class="ustack" style="height:${(totals[i] / max) * 100}%">${Object.keys(MIX).map((k) => `<i class="ag-${k}" style="flex:${d[k]}"></i>`).join('')}</div></div>`).join('');
  const axis = days.map((_, i) => `<span>${S.urange === 7 || i % 5 === 4 ? dayName(i) : ''}</span>`).join('');
  const hrow = (label, v, color, max2) => `<div class="hrow"><span>${label}</span><div class="htrack"><i class="${color}" style="width:${(v / max2) * 100}%"></i></div><b>${fmtT(v)}</b></div>`;
  const agg = per.length > 1;
  const second = agg
    ? per.map(([p, d]) => [p, sum(d.map(sum))]).sort((a, b) => b[1] - a[1]).map(([p, v], _, a) => hrow(`${mono(p.id)}<span class="trunc">${p.id}</span>`, v, '', a[0][1])).join('')
    : MODELS.map(([m, sh]) => hrow(`<span class="trunc">${m}</span>`, all * sh, '', all * MODELS[0][1])).join('');
  return `<div class="mpane">
    <div class="mhead"><h2>${scopeName()}</h2><div class="seg" role="group" aria-label="Range">${[[7, '7 days'], [30, '30 days']].map(([n, l]) => `<button data-act="urange" data-arg="${n}" aria-pressed="${S.urange === n}">${l}</button>`).join('')}</div></div>
    <div class="uscroll">
      <div class="ustats"><div class="ustat"><b>${fmtT(all)}</b><span>Tokens</span></div><div class="ustat"><b>$${(all / 1e6 * 4.2).toFixed(2)}</b><span>Cost</span></div><div class="ustat"><b>${Math.round(all / 9e4)}</b><span>Chats</span></div><div class="ustat"><b>${Math.round(all / 4e5)}h</b><span>Agent time</span></div></div>
      <div class="ucard"><h3>Tokens per day<span class="leg">${Object.keys(MIX).map((k) => `<span><i class="ag-${k}"></i><span>${agentName(k)}</span></span>`).join('')}</span></h3><div class="uchart">${bars}</div><div class="uaxis">${axis}</div></div>
      <div class="ucard"><h3>By agent</h3><div class="hrows">${byAgent.map(([k, v]) => hrow(`${glyph(k)}<span class="trunc">${agentName(k)}</span>`, v, `ag-${k}`, byAgent[0][1])).join('')}</div></div>
      <div class="ucard"><h3>${agg ? 'By project' : 'By model'}</h3><div class="hrows">${second}</div></div>
      <p class="ufoot">Cost uses each provider’s list price. Local models count tokens but cost nothing.</p>
    </div>
  </div>`;
}

function composer(opts = {}) {

  const bar = opts.right

        <div class="dock"><div class="col">${queueHTML(c)}${composer({ ph: 'Enter sends, Shift+Enter adds a line. @ mentions a file.' })}</div></div>`}
      </main>
      ${isChats() || other ? `<section class="isl-r" aria-label="Side panel">
        ${!open ? '' : other ? chatPane : `<div class="isl-rp"><div class="ih">${tabs.find(([k]) => k === S.tab3)[1]}</div><div class="pane-b" data-scroll="pane">${pane}</div></div>`}
        <nav class="mrail prail" aria-label="Side panel tabs">
          ${rtabs.map(([k, l, ic]) => `<button data-act="ptab" data-arg="${k}" aria-label="${l}" title="${l}" aria-pressed="${open && rtab === k}">${ic}</button>`).join('')}
          <span class="grow"></span>
          <button data-act="panel" aria-label="${open ? 'Hide' : 'Show'} side panel" title="${open ? 'Hide' : 'Show'} side panel" aria-expanded="${open}">${I.panelR}</button>
        </nav>
      </section>` : ''}
      ${palHTML()}
      ${winctl()}
    </div>
  </div>`;
}


/* ---------------- island open/close ----------------
   Width animates so the chat column follows the island. GPUI lays out every frame anyway.
   Open 200ms, close 160ms. Toggling again mid-way reverses from where it is. */
const ISLAND = { side: '.isl-l .side', panel: '.isl-rp' };
const ISLAND_W = { side: 286, get panel() { return chatIsland() ? 440 : 330; } };
const islandRun = {};
function toggleIsland(k) {
  const run = islandRun[k];
  if (run) {
    // start from where it is with a fresh ease-out; reverse() would play the curve backwards and end abruptly
    const cs = getComputedStyle(run.el), from = { width: cs.width, opacity: cs.opacity };
    run.a.onfinish = null; run.a.cancel();
    return animateIsland(k, run.el, from, !run.closing);
  }
  const opening = !S[k];
  if (opening) { S[k] = true; paint(); }
  const el = stage.querySelector(ISLAND[k]);
  if (!el || matchMedia('(prefers-reduced-motion: reduce)').matches) { if (!opening) { S[k] = false; paint(); } return; }
  animateIsland(k, el, opening ? { width: '0px', opacity: 0 } : { width: `${ISLAND_W[k]}px`, opacity: 1 }, !opening);
}
function animateIsland(k, el, from, closing) {
  const to = closing ? { width: '0px', opacity: 0 } : { width: `${ISLAND_W[k]}px`, opacity: 1 };
  const a = el.animate([from, to], { duration: closing ? 160 : 200, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', fill: 'forwards' });
  islandRun[k] = { a, el, closing };
  a.onfinish = () => {
    delete islandRun[k];
    if (closing) { S[k] = false; paint(); } else a.cancel();
  };
}

/* Pointer clicks slide a rail's active highlight from the old button to the new one.
   Keyboard switches stay instant. */
/* Leaving or entering Chats moves the chat between the center and the right island.
   The composer travels there so the eye follows it. A copy flies on top because the islands clip,
   and the real composer stays focused underneath at opacity 0. Runs on the keyboard too: it tells you where the chat went. */
function moveChat(change) {
  const was = isChats(), from = stage.querySelector('.composer')?.getBoundingClientRect();
  change();
  if (was === isChats() || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const comp = stage.querySelector('.composer');
  if (!comp || !from) {
    // right island closed: the chat went nowhere visible, so the Chat tab brightens once
    const btn = !isChats() && stage.querySelector('.isl-r [data-arg="chat"]');
    if (btn) { const cs = getComputedStyle(btn); btn.animate([{ backgroundColor: cs.getPropertyValue('--sel'), color: cs.getPropertyValue('--fg') }, {}], { duration: 600, easing: 'ease-out' }); }
    return;
  }
  const app = stage.querySelector('.app'), a = app.getBoundingClientRect(), to = comp.getBoundingClientRect();
  const ghost = comp.cloneNode(true);
  Object.assign(ghost.style, { position: 'absolute', zIndex: 'var(--z-float)', margin: 0, left: `${to.left - a.left}px`, top: `${to.top - a.top}px`, width: `${to.width}px`, pointerEvents: 'none' });
  app.append(ghost);
  comp.style.opacity = 0;
  // centers line up, so the width change needs no scaling
  const dx = from.left + from.width / 2 - (to.left + to.width / 2), dy = from.bottom - to.bottom;
  ghost.animate({ transform: [`translate(${dx}px, ${dy}px)`, 'none'] }, { duration: 220, easing: 'cubic-bezier(0.65, 0, 0.35, 1)' }).onfinish = () => { ghost.remove(); comp.style.opacity = ''; };
  stage.querySelector(isChats() ? '.main .scroll' : '.chatp .scroll')?.animate({ opacity: [0, 1], transform: [`translateX(${isChats() ? 12 : -12}px)`, 'none'] }, { duration: 150, easing: 'cubic-bezier(0.23, 1, 0.32, 1)' });
}
function slideHighlight(island, e, change) {
  const sel = `${island} .mrail button[aria-pressed="true"]`;
  const from = e && e.detail > 0 && stage.querySelector(sel);
  const y0 = from && from.offsetTop;
  change();
  const to = from && stage.querySelector(sel);
  if (!to || to.offsetTop === y0 || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  to.animate({ transform: [`translateY(${y0 - to.offsetTop}px)`, 'none'] }, { duration: 150, easing: 'cubic-bezier(0.23, 1, 0.32, 1)', pseudoElement: '::before' });
}

/* ---------------- painting ---------------- */
const stage = document.getElementById('stage');
let firstPaint = true;
function paint(fresh) {
  const scrolls = {};
  if (!fresh) stage.querySelectorAll('[data-scroll]').forEach((el) => (scrolls[el.dataset.scroll] = el.scrollTop));
  const ae = document.activeElement;
  const fkey = S.focus || (ae && ae.dataset && ae.dataset.key);
  const sel = ae && 'selectionStart' in ae && ae.dataset.key ? [ae.selectionStart, ae.selectionEnd] : null;
  const btnKey = !fkey && ae && ae.dataset && ae.dataset.act ? `[data-act="${ae.dataset.act}"]${ae.dataset.arg ? `[data-arg="${ae.dataset.arg}"]` : ''}` : null;
  document.body.dataset.theme = S.theme;
  try { localStorage.setItem('adeline-design', JSON.stringify(Object.fromEntries(KEEP.map((k) => [k, S[k]])))); } catch { /* storage blocked */ }
  stage.innerHTML = vIsl();
  stage.querySelectorAll('[data-scroll]').forEach((el) => {
    const k = el.dataset.scroll;
    if (k in scrolls) el.scrollTop = scrolls[k];
    else if (k === 'chat' || k === 'rchat') el.scrollTop = el.scrollHeight;
  });
  if (fresh) {
    const row = stage.querySelector('[data-scroll="side"] [aria-current="true"], [data-scroll="list"] [aria-current="true"]');
    row && row.scrollIntoView({ block: 'nearest' });
  }
  if (fkey) {
    const el = stage.querySelector(`[data-key="${fkey}"]`);
    if (el) { el.focus(); if (sel && !S.focus) el.setSelectionRange(sel[0], sel[1]); else el.setSelectionRange(el.value.length, el.value.length); }
  } else if (btnKey) {
    const el = stage.querySelector(btnKey);
    el && el.focus();
  }
  S.focus = null;
  autosize();
  requestAnimationFrame(autosize);
}
window.addEventListener('resize', autosize);
function autosize() {
  const t = stage.querySelector('textarea[data-key="draft"]');
  if (!t) return;
  t.style.height = 'auto';
  t.style.height = t.scrollHeight + 'px';
}

/* ---------------- actions ---------------- */
function goProcessing(c, label) {
  c.g = 'processing'; c.time = 'now'; c.unread = false;
  convo(c).push({ type: 'thinking', label, since: Date.now() });
}
function send() {
  const text = S.draft.trim();
  if (!text && !S.files.length) return;
  const c = active();
  if (c.g === 'processing') {
    (S.queues[c.id] ||= []).push({ id: uid(), text, files: [...S.files] });
  } else {
    if (c.fresh) { c.title = text.length > 64 ? text.slice(0, 64) + '…' : text; c.fresh = false; }
    convo(c).push({ type: 'user', text, files: [...S.files], time: nowTime() });
    goProcessing(c, 'Reading the project');
  }
  S.draft = ''; S.files = []; S.focus = 'draft';
  paint();
}
const ACT = {
  chat(id) { S.active = id; const c = active(); c.unread = false; S.draft = ''; S.files = []; paint(); },
  proj(id) { if (id !== S.project) switchProject(id); S.palette = false; paint(); },
  closeproj(id) {
    if (S.openP.length < 2) return;
    const i = S.openP.indexOf(id);
    S.openP.splice(i, 1);
    if (id === S.project) switchProject(S.openP[Math.max(0, i - 1)]);
    paint();
  },
  palopen() { S.palette = true; S.pq = ''; S.pi = 0; S.focus = 'pq'; paint(); },
  palclose() { S.palette = false; paint(); stage.querySelector('.psw')?.focus(); },
  grp(k) { S.collapsed[k] = !S.collapsed[k]; paint(); },
  work(id) { S.open[id] = !S.open[id]; paint(); },
  panel() { toggleIsland('panel'); },
  side() { toggleIsland('side'); },
  search() { S.searchOpen = !S.searchOpen; if (S.searchOpen) S.focus = 'search'; else S.query = ''; paint(); },
  new() {
    const c = newChat(S.project);
    S.active = c.id; S.query = ''; S.focus = 'draft'; S.collapsed.today = false; paint();
  },
  send,
  unfile(i) { S.files.splice(+i, 1); paint(); },
  'q-edit'(id) { const q = S.queues[S.active]; const i = q.findIndex((m) => m.id === id); const [m] = q.splice(i, 1); S.draft = m.text; S.files = m.files; S.focus = 'draft'; paint(); },
  'q-remove'(id) { const q = S.queues[S.active]; q.splice(q.findIndex((m) => m.id === id), 1); paint(); },
  'q-send'(id) {
    const q = S.queues[S.active]; const [m] = q.splice(q.findIndex((x) => x.id === id), 1);
    const cv = convo(active()); const ti = cv.findIndex((x) => x.type === 'thinking');
    cv.splice(ti < 0 ? cv.length : ti, 0, { type: 'user', text: m.text, files: m.files, time: nowTime(), note: 'Sent now' });
    paint();
  },
  answer(arg) {
    const [id, mi, oi] = arg.split(':'); const c = CHATS.find((x) => x.id === id); const cv = convo(c); const m = cv[+mi];
    cv.splice(+mi, 1, { type: 'user', text: m.opts[+oi], files: [], time: nowTime() });
    goProcessing(c, 'Applying your answer'); paint();
  },
  theme(v) { S.theme = v; paint(); },
  surface(v) { S.surface = v; paint(); },
  hue(h) { S.hue = h === 'grey' ? h : +h; paint(); },
  ptab(k, e) { if (k !== 'chat') S.tab3 = k; if (S.panel) slideHighlight('.isl-r', e, paint); else toggleIsland('panel'); },
  fold(k) { S.fold[k] = !S.fold[k]; paint(); },
  doc(k) { S.doc = k; paint(); },
  fmt(c) {
    const ed = stage.querySelector('.doc'); ed.focus();
    if (c === 'h2') document.execCommand('formatBlock', false, 'h2');
    else if (c === 'ul') document.execCommand('insertUnorderedList');
    else document.execCommand(c);
  },
  tfile(k) { S.termIn = (S.termIn ? S.termIn + ' ' : 'cat ') + k; S.focus = 'term'; paint(); },
  termfocus() { if (!getSelection().toString()) stage.querySelector('[data-key="term"]')?.focus(); },
  board(k) { S.board = k; paint(); },
  blabel(l) { S.blabel = l; paint(); },
  bagent(a) { S.bagent = S.bagent === a ? '' : a; paint(); },
  btab(id) { S.tab = id; paint(); },
  bnew() { S.tabs = [TABS0[0]]; S.tab = TABS0[0].id; paint(); },
  btabx(id) { S.tabs = S.tabs.filter((t) => t.id !== id); paint(); },
  uscope(k) { S.uscope = k; paint(); },
  urange(n) { S.urange = +n; paint(); },
  appmode(k, e) { slideHighlight('.isl-l', e, () => moveChat(() => { S.appMode = k; paint(); })); },
};
document.addEventListener('keydown', (e) => {
  if (!e.ctrlKey || e.altKey || e.metaKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= MODES.length) { e.preventDefault(); closeMenu(false); moveChat(() => { S.appMode = MODES[n - 1][0]; paint(); }); }
  if (e.key === 'b' || e.key === 'B') { e.preventDefault(); closeMenu(false); ACT.side(); }
  if (e.key === ',') { e.preventDefault(); closeMenu(false); ACT.appmode('settings'); }
  if (e.key === 'p' || e.key === 'P') {
    e.preventDefault(); closeMenu(false);
    ACT.palopen();
  }
});

stage.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || !stage.contains(el)) return;
  const a = el.dataset.act;
  if (a === 'menu') return openMenu(el.dataset.arg, el);
  ACT[a] && ACT[a](el.dataset.arg, e);
});
// formatting buttons act on the editor's selection, so they must not take focus from it
stage.addEventListener('mousedown', (e) => { if (e.target.closest('.fmt')) e.preventDefault(); });
stage.addEventListener('input', (e) => {
  const k = e.target.dataset.key;
  if (k === 'draft') {
    S.draft = e.target.value; autosize();
    const b = stage.querySelector('.send'); if (b) b.disabled = !(S.draft.trim() || S.files.length);
  } else if (k === 'search') { S.query = e.target.value; paint(); }
  else if (k === 'pq') { S.pq = e.target.value; S.pi = 0; paint(); }
  else if (k === 'term') S.termIn = e.target.value;
  else if (e.target.dataset.doc) DOC_HTML[e.target.dataset.doc] = e.target.innerHTML;
});
stage.addEventListener('keydown', (e) => {
  const k = e.target.dataset && e.target.dataset.key;
  if (k === 'draft' && e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
  if (k === 'term' && e.key === 'Enter') { e.preventDefault(); runTerm(e.target.value.trim()); }
  if (k === 'search' && e.key === 'Escape') { S.query = ''; S.searchOpen = false; paint(); }
  if (k === 'pq') {
    const ids = palRows().filter((r) => r.id).map((r) => r.id);
    if (e.key === 'Escape') { e.preventDefault(); ACT.palclose(); }
    else if (e.key === 'ArrowDown' && ids.length) { e.preventDefault(); S.pi = (S.pi + 1) % ids.length; paint(); stage.querySelector('.pal-i[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'ArrowUp' && ids.length) { e.preventDefault(); S.pi = (S.pi - 1 + ids.length) % ids.length; paint(); stage.querySelector('.pal-i[aria-selected="true"]')?.scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter' && ids[S.pi]) { e.preventDefault(); ACT.proj(ids[S.pi]); }
  }
});

/* ---------------- popover menu ---------------- */
const pop = document.getElementById('pop');
let popAnchor = null;
function menuSpec(name) {
  const radio = (label, on, run, hint, icon = '') => ({ label, on, run, hint, icon });
  switch (name) {
    case 'agent': return { title: 'Agent', items: Object.keys(AGENTS).map((k) => radio(agentName(k), S.agent === k, () => { S.agent = k; S.model = AGENTS[k].models[0]; }, null, glyph(k))) };
    case 'model': return { title: agentName(S.agent) + ' models', items: AGENTS[S.agent].models.map((m) => radio(m, S.model === m, () => (S.model = m))) };
    case 'effort': return { title: 'Effort', items: [['Low', 'Fast, for small edits'], ['Medium', 'Most everyday work'], ['High', 'Harder bugs and refactors'], ['X-High', 'Slow, for the hardest problems']].map(([l, h]) => radio(l, S.effort === l, () => (S.effort = l), h)) };
    case 'mode': return { title: 'Permissions', items: [['Default', 'Asks before edits and commands'], ['Plan', 'Reads and plans, no edits'], ['Accept edits', 'Edits files, asks before commands'], ['Full access', 'Edits and runs without asking']].map(([l, h]) => radio(l, S.mode === l, () => (S.mode = l), h)) };
    case 'attach': return { title: 'Recent files', items: Object.keys(FILESIZE).map((f) => radio(f, S.files.includes(f), () => { if (!S.files.includes(f)) S.files.push(f); S.focus = 'draft'; }, FILESIZE[f], I.file)) };
  }
}
function openMenu(name, anchor) {
  const spec = menuSpec(name);
  popAnchor = { name, el: anchor };
  pop.innerHTML = `<div class="ph">${spec.title}</div>` + (spec.html || spec.items.map((it, i) => it.header ? `<div class="ph ph-sec">${it.header}</div>` :
    `<button role="menuitemradio" aria-checked="${!!it.on}" data-i="${i}">${it.icon}<span class="mi"><span>${it.label}</span>${it.hint ? `<span class="mh">${it.hint}</span>` : ''}</span>${it.on ? tick : ''}</button>`).join(''));
  pop._items = spec.items || [];
  pop.setAttribute('role', spec.html ? 'dialog' : 'menu');
  pop.setAttribute('aria-label', spec.title);
  pop.classList.remove('open');
  pop.style.display = 'block'; pop.style.visibility = 'hidden';
  const r = anchor.getBoundingClientRect(), w = pop.offsetWidth, h = pop.offsetHeight;
  const below = r.bottom + 6 + h < innerHeight - 8;
  const left = Math.max(8, Math.min(r.left, innerWidth - w - 8));
  pop.style.left = left + 'px';
  pop.style.top = (below ? r.bottom + 6 : r.top - h - 6) + 'px';
  pop.style.setProperty('--o', `${r.left - left + r.width / 2}px ${below ? '0' : '100%'}`);
  pop.style.display = ''; pop.style.visibility = '';
  pop.classList.add('open');
  pop.setAttribute('aria-hidden', 'false');
  anchor.setAttribute('aria-expanded', 'true');
  (pop.querySelector('[aria-checked="true"]') || pop.querySelector('button'))?.focus();
}
function closeMenu(refocus) {
  if (!popAnchor) return;
  pop.classList.remove('open'); pop.setAttribute('aria-hidden', 'true');
  const { name, el } = popAnchor; popAnchor = null;
  el.removeAttribute('aria-expanded');
  if (refocus) (stage.querySelector(`[data-act="menu"][data-arg="${name}"]`) || el).focus();
}
pop.addEventListener('click', (e) => {
  const b = e.target.closest('button[data-i]'); if (!b) return;
  const it = pop._items[+b.dataset.i]; const name = popAnchor.name;
  closeMenu(false); it.run();
  paint();
  if (!S.focus) stage.querySelector(`[data-act="menu"][data-arg="${name}"]`)?.focus();
});
document.addEventListener('mousedown', (e) => { if (popAnchor && !pop.contains(e.target) && !popAnchor.el.contains(e.target)) closeMenu(false); });
document.addEventListener('keydown', (e) => {
  if (!popAnchor) return;
  const btns = [...pop.querySelectorAll('button')];
  const i = btns.indexOf(document.activeElement);
  if (e.key === 'Escape') { e.preventDefault(); closeMenu(true); }
  else if (e.key === 'ArrowDown' && btns.length) { e.preventDefault(); btns[(i + 1) % btns.length].focus(); }
  else if (e.key === 'ArrowUp' && btns.length) { e.preventDefault(); btns[(i - 1 + btns.length) % btns.length].focus(); }
  else if (e.key === 'Tab') closeMenu(false);
}, true);
window.addEventListener('resize', () => closeMenu(false));

/* live timers */
setInterval(() => document.querySelectorAll('[data-since]').forEach((el) => (el.textContent = dur(Date.now() - +el.dataset.since))), 1000);

const TABS0 = S.tabs.slice();
const KEEP = ['theme', 'surface', 'hue', 'side', 'panel', 'appMode'];
try {
  const saved = JSON.parse(localStorage.getItem('adeline-design') || '{}');
  KEEP.forEach((k) => { if (k in saved) S[k] = saved[k]; });
  if (S.appMode !== 'settings' && !MODES.some((m) => m[0] === S.appMode)) S.appMode = 'chats';
} catch { /* storage blocked: start from the defaults */ }
paint(true);
</script>
