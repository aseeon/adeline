[package]
name = "adeline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A native GPUI desktop workspace"

[dependencies]
adeline_core.workspace = true
adeline_engine.workspace = true
adeline_ui = { workspace = true, optional = true }
gpui-kit = { workspace = true, optional = true }
mimalloc.workspace = true

# The default build is the desktop app. `--no-default-features` builds the
# headless one: engine, bridge and `--version`, with no window and no desktop
# or GPU libraries (`docs/archive/scope-headless-build.md`).
[features]
default = ["gui"]
gui = ["dep:adeline_ui", "adeline_engine/gui"]
profiler = ["gui", "adeline_ui/profiler"]
# `adeline --control` and `adeline ui` for agents (`docs/archive/scope-ui-control.md`).
control = ["gui", "adeline_ui/control"]
test-support = ["control", "dep:gpui-kit", "gpui-kit/test-support"]

[[test]]
name = "ui"
required-features = ["test-support"]

[package.metadata.cargo-shear]
ignored = ["gpui-kit"]

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "io-util"] }

[build-dependencies]
embed-resource.workspace = true
resvg.workspace = true

[lints]
workspace = true
