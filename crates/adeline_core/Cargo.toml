[package]
name = "adeline_core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
adeline_assets.workspace = true
anyhow.workspace = true
async-channel.workspace = true
chrono.workspace = true
gethostname.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
tokio = { workspace = true, features = ["rt", "fs", "net", "io-util", "io-std", "process", "time", "macros"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console"] }

# Test helpers that other crates' tests use.
[features]
test-util = []

[lints]
workspace = true
