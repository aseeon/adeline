[package]
name = "adeline_ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
adeline_assets.workspace = true
adeline_core.workspace = true
anyhow.workspace = true
async-channel.workspace = true
chrono.workspace = true
gpui-kit.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "process", "sync", "time", "macros"] }
tracing.workspace = true

[features]
# Frame timings for profiling builds, see `frame_log.rs`.
profiler = ["gpui-kit/profiler"]

[lints]
workspace = true
