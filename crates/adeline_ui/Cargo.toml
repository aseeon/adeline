[package]
name = "adeline_ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[dependencies]
adeline_assets.workspace = true
adeline_core.workspace = true
adeline_docs.workspace = true
anyhow.workspace = true
async-channel.workspace = true
chrono.workspace = true
gpui-kit = { workspace = true, features = ["tree-sitter-markdown", "tree-sitter-yaml", "tree-sitter-toml"] }
mermaid-rs-renderer.workspace = true
resvg = { workspace = true, features = ["text", "system-fonts"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_yaml_ng.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "process", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[features]
# Frame timings for profiling builds, see `frame_log.rs`.
profiler = ["gpui-kit/profiler"]
# GPUI's test platform, for the UI tests in `crates/adeline/tests`.
test-support = ["gpui-kit/test-support"]

[lints]
workspace = true
