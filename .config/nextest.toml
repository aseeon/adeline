# https://nexte.st/docs/configuration/
[profile.default]
slow-timeout = { period = "60s", terminate-after = 1 }

[profile.ci]
fail-fast = false

# The UI tests against live engines connect, install and wait on remote machines.
[[profile.default.overrides]]
filter = 'package(=adeline) & binary(=ui)'
slow-timeout = { period = "60s", terminate-after = 4 }
