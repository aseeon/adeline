# Spell-checker config for https://github.com/crate-ci/typos (as in Zed).
[files]
ignore-files = true
ignore-hidden = false
extend-exclude = [
    ".git/",
    # Generated.
    "Cargo.lock",
    "output/",
    # The ACP registry copy, spelled as published.
    "assets/registry.json",
]

[default]
check-filename = true

[default.extend-words]
# Upstream theme name, spelled as published.
porfolio = "porfolio"
hass = "hass"
damon = "damon"
