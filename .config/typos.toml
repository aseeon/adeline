# Spell-checker config for https://github.com/crate-ci/typos (as in Zed).
[files]
ignore-files = true
ignore-hidden = false
extend-exclude = [
    ".git/",
    "Cargo.lock",
    "output/",
    "assets/registry.json",
    ".agents/skills/",
    ".claude/skills/",
    "docs/research_notes/",
]

[default]
check-filename = true

[default.extend-words]
porfolio = "porfolio"
hass = "hass"
damon = "damon"
